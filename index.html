<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CR7 WebOS - Stardance 2026</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #070b14;
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* TOP BAR */

        .top-bar {
            height: 55px;
            background: #111827;
            border-bottom: 2px solid #eab308;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .cr7-brand {
            color: #eab308;
            font-size: 20px;
            font-weight: bold;
        }

        .system-info {
            display: flex;
            gap: 20px;
            color: #cbd5e1;
        }

        /* DESKTOP */

        .desktop {
            position: relative;
            width: 100%;
            height: calc(100vh - 55px);
            overflow: hidden;
        }

        /* 3-COLUMN WALLPAPER GRID */

        .wallpaper-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px;
            z-index: 1;
        }

        .wallpaper-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: grab;
            user-select: none;
            -webkit-user-drag: none;
        }

        .wallpaper-img:active {
            cursor: grabbing;
        }

        /* APP ICONS (DRAGGABLE) */

        .app-icon {
            position: absolute;
            width: 100px;
            text-align: center;
            cursor: move;
            user-select: none;
            z-index: 5;
            touch-action: none;
        }

        .icon-box {
            width: 65px;
            height: 65px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(234, 179, 8, 0.4);
            border-radius: 15px;
            backdrop-filter: blur(5px);
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .app-icon:hover .icon-box {
            transform: scale(1.08);
            background: rgba(17, 24, 39, 0.9);
            border-color: #eab308;
        }

        .app-name {
            margin-top: 7px;
            font-size: 12px;
            color: #ffffff;
            font-weight: 600;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <div class="top-bar">

        <div class="cr7-brand">
            ⚽ CR7 WebOS
        </div>

        <div class="system-info">
            <span id="clock">Loading...</span>
            <span>📶 Wi-Fi</span>
            <span>🔋 100%</span>
        </div>

    </div>


    <!-- DESKTOP -->

    <div class="desktop" id="desktop">

        <!-- 3-COLUMN WALLPAPER GRID -->

        <div class="wallpaper-grid">
            <img src="https://pbs.twimg.com/media/Dli80phX0AA0wpF.jpg" 
                 alt="Ronaldo 1" 
                 class="wallpaper-img draggable">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQCvNQAcLA9IaI0Y3MUul9btzDWxuwWfnMDGpRC_67lJg&s=10" 
                 alt="Ronaldo Center" 
                 class="wallpaper-img draggable">

            <img src="https://i2-prod.irishmirror.ie/article8236140.ece/ALTERNATES/s1200e/Cristiano-Ronaldo-Memesg.jpg" 
                 alt="Ronaldo 2" 
                 class="wallpaper-img draggable">
        </div>

        <!-- APP ICONS -->

        <div class="app-icon draggable" id="photosIcon" style="left: 40px; top: 30px;">
            <div class="icon-box">📸</div>
            <div class="app-name">Ronaldo Photos</div>
        </div>

        <div class="app-icon draggable" id="musicIcon" style="left: 160px; top: 30px;">
            <div class="icon-box">🎵</div>
            <div class="app-name">CR7 Music</div>
        </div>

        <div class="app-icon draggable" id="careerIcon" style="left: 280px; top: 30px;">
            <div class="icon-box">🏆</div>
            <div class="app-name">Career</div>
        </div>

        <div class="app-icon draggable" id="aboutIcon" style="left: 400px; top: 30px;">
            <div class="icon-box">ℹ️</div>
            <div class="app-name">About</div>
        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>
        // Live Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Drag Engine for Apps & Wallpaper Images
        const draggables = document.querySelectorAll('.draggable');

        draggables.forEach(element => {
            let active = false;
            let currentX, currentY, initialX, initialY;
            let xOffset = 0, yOffset = 0;

            element.addEventListener('mousedown', dragStart);
            element.addEventListener('touchstart', dragStart, { passive: false });

            function dragStart(e) {
                if (e.type === "touchstart") {
                    initialX = e.touches[0].clientX - xOffset;
                    initialY = e.touches[0].clientY - yOffset;
                } else {
                    initialX = e.clientX - xOffset;
                    initialY = e.clientY - yOffset;
                }

                if (e.target === element || element.contains(e.target)) {
                    active = true;
                    document.addEventListener('mousemove', drag);
                    document.addEventListener('touchmove', drag, { passive: false });
                    document.addEventListener('mouseup', dragEnd);
                    document.addEventListener('touchend', dragEnd);
                }
            }

            function drag(e) {
                if (active) {
                    e.preventDefault();

                    let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                    let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;

                    currentX = clientX - initialX;
                    currentY = clientY - initialY;

                    xOffset = currentX;
                    yOffset = currentY;

                    setTranslate(currentX, currentY, element);
                }
            }

            function setTranslate(xPos, yPos, el) {
                el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
            }

            function dragEnd() {
                initialX = currentX;
                initialY = currentY;
                active = false;

                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', dragEnd);
                document.removeEventListener('touchend', dragEnd);
            }
        });
    </script>

</body>

</html>
